name: Aplicar banner gerado

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    if: ${{ hashFiles('tmp/banner-home.b64.*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Montar banner WebP
        shell: bash
        run: |
          set -e
          test -f tmp/banner-home.b64.01
          test -f tmp/banner-home.b64.02
          test -f tmp/banner-home.b64.03
          test -f tmp/banner-home.b64.04
          cat tmp/banner-home.b64.* > /tmp/banner-home.b64
          base64 -d /tmp/banner-home.b64 > assets/images/banner-home.webp
          file assets/images/banner-home.webp
          ls -lh assets/images/banner-home.webp

      - name: Publicar banner
        shell: bash
        run: |
          set -e
          rm -f tmp/banner-home.b64.*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/banner-home.webp index.html
          git add -u tmp
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "feat: publicar novo banner principal [skip image optimization]"
          git push
